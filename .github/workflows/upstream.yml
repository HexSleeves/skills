name: Upstream skill changes

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test_upstream.sh
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/upstream check --markdown > body.md
          title="Upstream skill changes"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -s body.md ]; then
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file body.md
            else
              gh issue create --title "$title" --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Every fork matches its upstream pin."
          fi
